<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sakura Runner 3D - Fast Speed Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body {
            background-color: #0b0512;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* OYUN İÇİ UI */
        #ui-container {
            position: absolute;
            top: 15px; left: 15px; right: 15px;
            display: none;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 800;
            text-shadow: 0 3px 10px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
        }
        #status-msg {
            position: absolute;
            top: 50px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #ffda79;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        /* MOBİL DOKUNMATİK KONTROLLER (BÜYÜK) */
        #mobile-controls {
            position: absolute;
            bottom: 30px;
            left: 0; right: 0;
            padding: 0 25px;
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 15;
            pointer-events: none;
        }

        /* D-PAD / JOYSTICK ALANI */
        .dpad-container {
            display: grid;
            grid-template-columns: repeat(3, 75px);
            grid-template-rows: repeat(3, 75px);
            gap: 8px;
            pointer-events: auto;
        }

        .touch-btn {
            background: rgba(255, 255, 255, 0.35);
            border: 3px solid rgba(255, 255, 255, 0.7);
            border-radius: 18px;
            color: white;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .touch-btn:active {
            background: rgba(255, 121, 36, 0.9);
            border-color: #ff7924;
            transform: scale(0.92);
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
        #btn-right { grid-column: 3; grid-row: 2; }

        /* ZIPLAMA BUTONU */
        #btn-jump {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(255, 82, 82, 0.75);
            border: 4px solid #ff5252;
            font-size: 22px;
            font-weight: 900;
            box-shadow: 0 6px 20px rgba(255, 82, 82, 0.6);
            pointer-events: auto;
        }
        #btn-jump:active {
            background: rgba(255, 82, 82, 1);
            transform: scale(0.9);
        }

        /* Menü Kartı Stili */
        .menu-card {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 380px;
            background: rgba(15, 8, 25, 0.94);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        .menu-title {
            font-size: 26px;
            font-weight: 900;
            color: #ff7924;
            text-shadow: 0 0 15px rgba(255,121,36,0.6);
            letter-spacing: 1px;
        }

        .currency-box {
            background: rgba(255,255,255,0.06);
            border: 1px dashed rgba(255,255,255,0.2);
            padding: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-around;
            font-size: 14px;
            font-weight: bold;
            color: #ffda79;
        }

        .developer-tag {
            font-size: 12px;
            color: #aaa;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 6px;
        }

        .btn {
            background: linear-gradient(45deg, #ff5252, #ff7924);
            color: white;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 82, 82, 0.4);
            width: 100%;
        }
        .btn-sell { background: linear-gradient(45deg, #10ac84, #1dd1a1); }
        .btn-secondary { background: linear-gradient(45deg, #6c5ce7, #a29bfe); }
        .btn-shop { background: linear-gradient(45deg, #f1c40f, #f39c12); }

        .section-title { font-size: 12px; color: #ff7924; font-weight: bold; text-align: left; }
        .color-options { display: flex; gap: 8px; justify-content: flex-start; }
        .color-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; }

        #game-over-menu { display: none; border: 1px solid rgba(255, 50, 50, 0.3); }
        #game-over-title { color: #ff3838; font-size: 36px; text-shadow: 0 0 15px rgba(255, 56, 56, 0.8); }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
        }
        .shop-item button { width: auto; padding: 5px 10px; font-size: 11px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<!-- OYUN İÇİ ARAYÜZ -->
<div id="ui-container">
    <div id="scoreDisplay">Sushi: 0</div>
    <div id="levelDisplay">Aşama: 1</div>
</div>
<div id="status-msg">İlerlemek için Yön Tuşlarını veya Ekranı Kullanın!</div>

<!-- MOBİL KONTROLLER -->
<div id="mobile-controls">
    <div class="dpad-container">
        <div class="touch-btn" id="btn-up">▲</div>
        <div class="touch-btn" id="btn-left">◄</div>
        <div class="touch-btn" id="btn-down">▼</div>
        <div class="touch-btn" id="btn-right">►</div>
    </div>
    <div class="touch-btn" id="btn-jump">ZIPLA</div>
</div>

<!-- ANA MENÜ -->
<div id="main-menu" class="menu-card">
    <div class="menu-title">SAKURA RUNNER</div>
    
    <div class="currency-box">
        <span>🍣 Sushi: <span id="total-sushi">0</span></span>
        <span>💴 Yen: <span id="total-yen">0</span></span>
    </div>

    <button class="btn" onclick="startGame()">Oyuna Başla</button>
    <button class="btn btn-sell" onclick="sellSushi()">🍣 Sushi Sat (+10¥)</button>
    <button class="btn btn-shop" onclick="openShopMenu()">🛒 Mağaza (Aksesuar)</button>
    <button class="btn btn-secondary" onclick="openCustomizeMenu()">Özelleştir</button>
    <div class="developer-tag">Geliştirici: <b>Berat Ersöz</b></div>
</div>

<!-- MAĞAZA MENÜSÜ -->
<div id="shop-menu" class="menu-card" style="display: none;">
    <div class="menu-title" style="font-size: 22px;">Aksesuar Mağazası</div>
    <div class="currency-box">
        <span>💴 Mevcut Yen: <span id="shop-yen">0</span></span>
    </div>
    
    <div class="shop-item">
        <span>🧢 Kırmızı Şapka</span>
        <button id="btn-hat" class="btn" onclick="buyHat()">200 Yen Al</button>
    </div>

    <div class="shop-item">
        <span>🧥 Şık Ceket</span>
        <button id="btn-jacket" class="btn" onclick="buyJacket()">300 Yen Al</button>
    </div>

    <button class="btn btn-secondary" onclick="closeShopMenu()">Geri Dön</button>
</div>

<!-- ÖZELLEŞTİRME MENÜSÜ -->
<div id="custom-menu" class="menu-card" style="display: none;">
    <div class="menu-title" style="font-size: 22px;">Karakter Özelleştirme</div>
    
    <div class="section-title">Kıyafet Rengi</div>
    <div class="color-options">
        <div class="color-btn" style="background: #ff3838;" onclick="setOutfit(0xff3838)"></div>
        <div class="color-btn" style="background: #17c0eb;" onclick="setOutfit(0x17c0eb)"></div>
        <div class="color-btn" style="background: #3ae374;" onclick="setOutfit(0x3ae374)"></div>
        <div class="color-btn" style="background: #fff200;" onclick="setOutfit(0xfff200)"></div>
        <div class="color-btn" style="background: #9c88ff;" onclick="setOutfit(0x9c88ff)"></div>
    </div>

    <div class="section-title">Ten Rengi</div>
    <div class="color-options">
        <div class="color-btn" style="background: #ffdbac;" onclick="setSkin(0xffdbac)"></div>
        <div class="color-btn" style="background: #f1c27d;" onclick="setSkin(0xf1c27d)"></div>
        <div class="color-btn" style="background: #e0ac69;" onclick="setSkin(0xe0ac69)"></div>
        <div class="color-btn" style="background: #6d4c41;" onclick="setSkin(0x6d4c41)"></div>
    </div>

    <div class="section-title">Saç Rengi</div>
    <div class="color-options">
        <div class="color-btn" style="background: #0a192f;" onclick="setHair(0x0a192f)"></div>
        <div class="color-btn" style="background: #111111;" onclick="setHair(0x111111)"></div>
        <div class="color-btn" style="background: #795548;" onclick="setHair(0x795548)"></div>
        <div class="color-btn" style="background: #fbc531;" onclick="setHair(0xfbc531)"></div>
        <div class="color-btn" style="background: #e84118;" onclick="setHair(0xe84118)"></div>
    </div>

    <button class="btn" onclick="closeCustomizeMenu()">Kaydet ve Dön</button>
</div>

<!-- ÖLDÜN EKRANI -->
<div id="game-over-menu" class="menu-card">
    <div id="game-over-title">ÖLDÜN</div>
    <p style="color: #ccc; font-size: 13px; margin-bottom: 5px;">Bulutların arasına düştün!</p>
    <button class="btn" onclick="respawn()">Yeniden Doğ</button>
    <button class="btn btn-secondary" onclick="goToMainMenu()">Ana Menüye Dön</button>
</div>

<script>
let scene, camera, renderer;
let playerGroup, outfitMesh, skinMeshes = [], hairMeshes = [];
let leftArmGroup, rightArmGroup, leftLegGroup, rightLegGroup;
let hatMesh, jacketMesh;

let outfitColor = 0xff3838;
let skinColor = 0xffdbac;
let hairColor = 0x0a192f;

let gameState = 'MAIN_MENU';
let currentSessionSushi = 0;
let totalSushi = 0;
let totalYen = 0;

let hasHat = false;
let hasJacket = false;

let level = 1;
let currentSpeed = 0;

/* --- HIZLANDIRILMIŞ HAREKET AYARLARI --- */
const baseSpeed = 0.12;      // Temel koşma hızı artırıldı (Eski: 0.065)
const strafeSpeed = 0.11;     // Sağa/Sola manevra hızı artırıldı (Eski: 0.055)
const gravity = -0.016;       // Yerçekimi uyurlandı
const jumpPower = 0.50;       // Zıplama gücü artırıldı (Eski: 0.42)

let playerX = 0;
let playerY = 1.2;
let velocityY = 0;
let isGrounded = true;

const keys = { w: false, s: false, a: false, d: false };

let platforms = [];
let sushis = [];
let sceneryBuildings = [];
let clouds = [];
let backgroundMountains = [];

const levelThemes = [
    { bg: 0x1a0a2a, fog: 0x2d123e, platform: 0x2c1a4d, border: 0xff7924 },
    { bg: 0x091e3a, fog: 0x103254, platform: 0x173a5e, border: 0xfbc531 },
    { bg: 0x22092c, fog: 0x3d1245, platform: 0x481e54, border: 0xff5252 },
    { bg: 0x052329, fog: 0x0a3c42, platform: 0x125159, border: 0x78e08f }
];

function init3D() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(levelThemes[0].bg);
    scene.fog = new THREE.FogExp2(levelThemes[0].fog, 0.012);

    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);

    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.HemisphereLight(0xffdfba, 0x221133, 0.7);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffa86b, 1.6);
    mainLight.position.set(20, 35, 15);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 1024;
    mainLight.shadow.mapSize.height = 1024;
    scene.add(mainLight);

    const rimLight = new THREE.DirectionalLight(0x6495ed, 0.8);
    rimLight.position.set(-20, 15, -20);
    scene.add(rimLight);

    createDetailedCharacter();
    positionCameraForMenu();
    createSkyClouds();
    createBackgroundDistants();
    setupTouchControls();
    updateUI();

    window.addEventListener('resize', onWindowResize);

    // KLAVYEYLE KONTROL
    window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'w' || e.code === 'ArrowUp') keys.w = true;
        if (key === 's' || e.code === 'ArrowDown') keys.s = true;
        if (key === 'a' || e.code === 'ArrowLeft') keys.a = true;
        if (key === 'd' || e.code === 'ArrowRight') keys.d = true;
        if (e.code === 'Space' && gameState === 'RUNNING') handleJump();
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'w' || e.code === 'ArrowUp') keys.w = false;
        if (key === 's' || e.code === 'ArrowDown') keys.s = false;
        if (key === 'a' || e.code === 'ArrowLeft') keys.a = false;
        if (key === 'd' || e.code === 'ArrowRight') keys.d = false;
    });

    animate();
}

function handleJump() {
    if (isGrounded) {
        velocityY = jumpPower;
        isGrounded = false;
    }
}

// MOBİL DOKUNMATİK BUTONLARI
function setupTouchControls() {
    const bindTouch = (id, keyName) => {
        const btn = document.getElementById(id);
        const start = (e) => { e.preventDefault(); keys[keyName] = true; };
        const end = (e) => { e.preventDefault(); keys[keyName] = false; };
        btn.addEventListener('touchstart', start);
        btn.addEventListener('touchend', end);
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
    };

    bindTouch('btn-up', 'w');
    bindTouch('btn-down', 's');
    bindTouch('btn-left', 'a');
    bindTouch('btn-right', 'd');

    const jumpBtn = document.getElementById('btn-jump');
    const jumpAction = (e) => { e.preventDefault(); if (gameState === 'RUNNING') handleJump(); };
    jumpBtn.addEventListener('touchstart', jumpAction);
    jumpBtn.addEventListener('mousedown', jumpAction);
}

function updateUI() {
    document.getElementById('total-sushi').innerText = totalSushi;
    document.getElementById('total-yen').innerText = totalYen;
    document.getElementById('shop-yen').innerText = totalYen;
    document.getElementById('scoreDisplay').innerText = `Sushi: ${currentSessionSushi}`;
}

function sellSushi() {
    if (totalSushi > 0) {
        totalYen += totalSushi * 10;
        alert(`${totalSushi} sushi satıldı ve ${totalSushi * 10} Yen kazanıldı!`);
        totalSushi = 0;
        updateUI();
    } else {
        alert("Satacak hiç sushin yok! Önce parkurda sushi topla.");
    }
}

function openShopMenu() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('shop-menu').style.display = 'flex';
    updateUI();
}

function closeShopMenu() {
    document.getElementById('shop-menu').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
}

function buyHat() {
    if (hasHat) {
        hatMesh.visible = !hatMesh.visible;
        document.getElementById('btn-hat').innerText = hatMesh.visible ? "Çıkar" : "Giydir";
        return;
    }
    if (totalYen >= 200) {
        totalYen -= 200;
        hasHat = true;
        hatMesh.visible = true;
        document.getElementById('btn-hat').innerText = "Çıkar";
        updateUI();
        alert("Kırmızı Şapka satın alındı!");
    } else {
        alert("Yetersiz Yen!");
    }
}

function buyJacket() {
    if (hasJacket) {
        jacketMesh.visible = !jacketMesh.visible;
        document.getElementById('btn-jacket').innerText = jacketMesh.visible ? "Çıkar" : "Giydir";
        return;
    }
    if (totalYen >= 300) {
        totalYen -= 300;
        hasJacket = true;
        jacketMesh.visible = true;
        document.getElementById('btn-jacket').innerText = "Çıkar";
        updateUI();
        alert("Şık Ceket satın alındı!");
    } else {
        alert("Yetersiz Yen!");
    }
}

function createSkyClouds() {
    clouds.forEach(c => scene.remove(c));
    clouds = [];
    const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffeef5, transparent: true, opacity: 0.75, roughness: 0.9 });

    for (let i = 0; i < 30; i++) {
        const cloudGroup = new THREE.Group();
        for (let j = 0; j < 5; j++) {
            const puff = new THREE.Mesh(new THREE.DodecahedronGeometry(2 + Math.random() * 2, 1), cloudMat);
            puff.position.set((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 6);
            cloudGroup.add(puff);
        }
        cloudGroup.position.set((Math.random() - 0.5) * 120, -5 - Math.random() * 12, -Math.random() * 160);
        scene.add(cloudGroup);
        clouds.push(cloudGroup);
    }
}

function createBackgroundDistants() {
    backgroundMountains.forEach(m => scene.remove(m));
    backgroundMountains = [];
    const mountainMat = new THREE.MeshStandardMaterial({ color: 0x120924, roughness: 1.0 });

    for (let i = 0; i < 10; i++) {
        const mountain = new THREE.Mesh(new THREE.ConeGeometry(15 + Math.random() * 20, 30 + Math.random() * 20, 5), mountainMat);
        const side = i % 2 === 0 ? -1 : 1;
        mountain.position.set(side * (45 + Math.random() * 30), -10, -30 - (i * 15));
        scene.add(mountain);
        backgroundMountains.push(mountain);
    }
}

function positionCameraForMenu() {
    camera.position.set(0, 1.3, 2.6);
    camera.lookAt(0, 1.0, 0);
}

function positionCameraForGame() {
    camera.position.set(0, 2.4, 4.8);
    camera.lookAt(0, 1.2, -1);
}

function startGame() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('ui-container').style.display = 'flex';
    document.getElementById('mobile-controls').style.display = 'flex';
    document.getElementById('status-msg').style.display = 'block';
    gameState = 'RUNNING';
    currentSessionSushi = 0;
    level = 1;
    playerX = 0;
    playerY = 1.2;
    velocityY = 0;
    playerGroup.position.set(playerX, playerY, 0);
    playerGroup.rotation.y = 0;

    updateUI();
    positionCameraForGame();
    buildLevel();
}

function openCustomizeMenu() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('custom-menu').style.display = 'flex';
    gameState = 'CUSTOMIZE';
}

function closeCustomizeMenu() {
    document.getElementById('custom-menu').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
    gameState = 'MAIN_MENU';
}

function gameOver() {
    gameState = 'GAME_OVER';
    document.getElementById('ui-container').style.display = 'none';
    document.getElementById('mobile-controls').style.display = 'none';
    document.getElementById('status-msg').style.display = 'none';
    document.getElementById('game-over-menu').style.display = 'flex';
}

function respawn() {
    document.getElementById('game-over-menu').style.display = 'none';
    document.getElementById('ui-container').style.display = 'flex';
    document.getElementById('mobile-controls').style.display = 'flex';
    document.getElementById('status-msg').style.display = 'block';
    gameState = 'RUNNING';
    playerX = 0;
    playerY = 1.2;
    velocityY = 0;
    playerGroup.position.set(playerX, playerY, 0);
    playerGroup.rotation.y = 0;
    positionCameraForGame();
    buildLevel();
}

function goToMainMenu() {
    document.getElementById('game-over-menu').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
    document.getElementById('mobile-controls').style.display = 'none';
    gameState = 'MAIN_MENU';
    positionCameraForMenu();
    playerX = 0;
    playerY = 1.2;
    playerGroup.position.set(0, 1.2, 0);
    updateUI();
}

function createNameTag(name) {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(30, 10, 196, 44);
    ctx.strokeStyle = '#ff7924'; ctx.lineWidth = 3;
    ctx.strokeRect(30, 10, 196, 44);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(name, 128, 32);

    const texture = new THREE.CanvasTexture(canvas);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture }));
    sprite.scale.set(0.7, 0.18, 1);
    sprite.position.set(0, 1.65, 0);
    return sprite;
}

function createGreyCat() {
    const catGroup = new THREE.Group();
    const catMat = new THREE.MeshStandardMaterial({ color: 0x5a5a60, roughness: 0.6 });
    const innerEarMat = new THREE.MeshStandardMaterial({ color: 0xffb6c1 });
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x2ed573, roughness: 0.1 });

    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.2, 0.35, 12), catMat);
    body.rotation.x = Math.PI / 2.5;
    catGroup.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), catMat);
    head.position.set(0, 0.22, 0.28);
    catGroup.add(head);

    for (let side of [-1, 1]) {
        const ear = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.12, 4), catMat);
        ear.position.set(side * 0.09, 0.38, 0.28);
        catGroup.add(ear);

        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 10), eyeMat);
        eye.position.set(side * 0.07, 0.25, 0.43);
        catGroup.add(eye);
    }
    return catGroup;
}

function createDetailedCharacter() {
    playerGroup = new THREE.Group();
    skinMeshes = [];
    hairMeshes = [];

    const outfitMat = new THREE.MeshStandardMaterial({ color: outfitColor, roughness: 0.3 });
    const skinMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.5 });
    const hairMat = new THREE.MeshStandardMaterial({ color: hairColor, roughness: 0.8 });

    outfitMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.15, 0.52, 16), outfitMat);
    outfitMesh.position.y = 0.65;
    playerGroup.add(outfitMesh);

    jacketMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.17, 0.54, 16), new THREE.MeshStandardMaterial({ color: 0x222f3e }));
    jacketMesh.position.y = 0.65;
    jacketMesh.visible = false;
    playerGroup.add(jacketMesh);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.185, 24, 24), skinMat);
    head.position.y = 1.12;
    playerGroup.add(head);
    skinMeshes.push(head);

    const hatGroup = new THREE.Group();
    const hatBase = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.14, 16), new THREE.MeshStandardMaterial({ color: 0xeb2f06 }));
    hatBase.position.y = 1.25;
    hatGroup.add(hatBase);
    hatMesh = hatGroup;
    hatMesh.visible = false;
    playerGroup.add(hatMesh);

    const hairTop = new THREE.Mesh(new THREE.SphereGeometry(0.198, 24, 24, 0, Math.PI * 2, 0, Math.PI / 1.75), hairMat);
    hairTop.position.set(0, 1.13, 0);
    playerGroup.add(hairTop);
    hairMeshes.push(hairTop);

    const longHair = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.1, 0.65, 12), hairMat);
    longHair.position.set(0, 0.8, -0.15);
    longHair.rotation.x = -0.15;
    playerGroup.add(longHair);
    hairMeshes.push(longHair);

    function buildArm(isLeft) {
        const armGroup = new THREE.Group();
        const side = isLeft ? -1 : 1;
        const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.038, 0.26, 12), outfitMat);
        upperArm.position.set(0, -0.13, 0);
        armGroup.add(upperArm);
        const lowerArm = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.032, 0.26, 12), skinMat);
        lowerArm.position.set(0, -0.39, 0);
        armGroup.add(lowerArm);
        skinMeshes.push(lowerArm);
        armGroup.position.set(side * 0.24, 0.86, 0);
        return armGroup;
    }

    leftArmGroup = buildArm(true);
    rightArmGroup = buildArm(false);
    playerGroup.add(leftArmGroup);
    playerGroup.add(rightArmGroup);

    const legGeo = new THREE.CylinderGeometry(0.06, 0.05, 0.42, 12);
    leftLegGroup = new THREE.Mesh(legGeo, outfitMat);
    leftLegGroup.position.set(-0.09, 0.21, 0);
    playerGroup.add(leftLegGroup);

    rightLegGroup = new THREE.Mesh(legGeo, outfitMat);
    rightLegGroup.position.set(0.09, 0.21, 0);
    playerGroup.add(rightLegGroup);

    playerGroup.add(createNameTag("MEVA"));
    playerGroup.position.set(playerX, playerY, 0);
    scene.add(playerGroup);
}

function setOutfit(color) { outfitColor = color; if (outfitMesh) outfitMesh.material.color.setHex(color); }
function setSkin(color) { skinColor = color; skinMeshes.forEach(m => m.material.color.setHex(color)); }
function setHair(color) { hairColor = color; hairMeshes.forEach(m => m.material.color.setHex(color)); }

function create3DJapaneseSign(text, mainColorHex) {
    const signGroup = new THREE.Group();
    const box = new THREE.Mesh(new THREE.BoxGeometry(0.25, 2.2, 1.1), new THREE.MeshStandardMaterial({ color: 0x0a0a10 }));
    signGroup.add(box);

    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, 128, 256);
    ctx.strokeStyle = mainColorHex; ctx.lineWidth = 8;
    ctx.strokeRect(6, 6, 116, 244);
    ctx.fillStyle = mainColorHex; ctx.textAlign = 'center';

    if (text === "RIP ARTHUR MORGAN") {
        ctx.font = '900 20px sans-serif'; ctx.fillText("R.I.P.", 64, 50);
        ctx.font = '900 18px sans-serif'; ctx.fillText("ARTHUR", 64, 110); ctx.fillText("MORGAN", 64, 170);
    } else {
        ctx.font = '900 44px sans-serif';
        for (let i = 0; i < text.length; i++) ctx.fillText(text[i], 64, 60 + (i * 50));
    }

    const planeGeo = new THREE.PlaneGeometry(1.05, 2.15);
    const neonMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) });
    const planeLeft = new THREE.Mesh(planeGeo, neonMat);
    planeLeft.position.x = 0.13; planeLeft.rotation.y = Math.PI / 2;
    signGroup.add(planeLeft);

    return signGroup;
}

function createJapaneseHouse(x, y, z, isLeft, forceArthurSign) {
    const group = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(4.8, 4.2, 5.8), new THREE.MeshStandardMaterial({ color: 0x241811 }));
    group.add(body);

    const roof = new THREE.Mesh(new THREE.ConeGeometry(4.5, 2.0, 4), new THREE.MeshStandardMaterial({ color: 0x191e24 }));
    roof.position.y = 3.0; roof.rotation.y = Math.PI / 4;
    group.add(roof);

    const cat = createGreyCat();
    cat.position.set(0, 4.0, 0);
    group.add(cat);

    const sign = create3DJapaneseSign(forceArthurSign ? "RIP ARTHUR MORGAN" : "寿司", forceArthurSign ? "#ff2222" : "#ff0055");
    sign.position.set(isLeft ? 2.5 : -2.5, 0.5, 0);
    group.add(sign);

    group.position.set(x, y + 2.1, z);
    scene.add(group);
    sceneryBuildings.push({ group, z });
}

function createPlatform(x, y, z, width, depth, theme) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, 0.45, depth), new THREE.MeshStandardMaterial({ color: theme.platform }));
    mesh.position.set(x, y, z);
    scene.add(mesh);

    const border = new THREE.Mesh(new THREE.BoxGeometry(width + 0.1, 0.1, depth + 0.1), new THREE.MeshStandardMaterial({ color: theme.border }));
    border.position.set(x, y + 0.225, z);
    scene.add(border);

    platforms.push({ mesh, border, width, depth, x, y, z });
}

function createSushi(x, y, z) {
    const group = new THREE.Group();
    const rice = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.22, 0.62), new THREE.MeshStandardMaterial({ color: 0xffffff }));
    group.add(rice);
    const salmon = new THREE.Mesh(new THREE.BoxGeometry(0.39, 0.12, 0.66), new THREE.MeshStandardMaterial({ color: 0xff4757 }));
    salmon.position.y = 0.15;
    group.add(salmon);

    group.position.set(x, y, z);
    scene.add(group);
    sushis.push({ group, collected: false, x, y, z });
}

function buildLevel() {
    platforms.forEach(p => { scene.remove(p.mesh); scene.remove(p.border); });
    sushis.forEach(s => scene.remove(s.group));
    sceneryBuildings.forEach(b => scene.remove(b.group));

    platforms = []; sushis = []; sceneryBuildings = [];
    const currentTheme = levelThemes[(level - 1) % levelThemes.length];
    scene.background.setHex(currentTheme.bg);
    scene.fog.color.setHex(currentTheme.fog);

    let currentZ = 0;
    for (let i = 0; i < 15; i++) {
        let pWidth = 4.5 + Math.random() * 1.5;
        let pDepth = 8 + Math.random() * 4;
        let pY = 0;
        let pX = (Math.random() - 0.5) * 1.5;

        createPlatform(pX, pY, currentZ, pWidth, pDepth, currentTheme);
        createJapaneseHouse(-8.5 - Math.random() * 2, pY - 0.5, currentZ, true, i === 2);
        createJapaneseHouse(8.5 + Math.random() * 2, pY - 0.5, currentZ, false, false);

        if (Math.random() > 0.25) {
            createSushi(pX + (Math.random() - 0.5) * (pWidth - 1), pY + 0.6, currentZ - Math.random() * (pDepth / 2));
        }

        currentZ -= (pDepth + 2.0 + Math.random() * 1.5);
    }
}

function update() {
    if (gameState === 'MAIN_MENU' || gameState === 'CUSTOMIZE') {
        if (playerGroup) playerGroup.rotation.y += 0.01;
        return;
    }
    if (gameState === 'GAME_OVER') return;

    if (keys.w) currentSpeed = baseSpeed + (level * 0.003);
    else if (keys.s) currentSpeed = -(baseSpeed + (level * 0.003));
    else currentSpeed = 0;

    if (keys.a && playerX > -4) playerX -= strafeSpeed;
    if (keys.d && playerX < 4) playerX += strafeSpeed;

    velocityY += gravity;
    playerY += velocityY;

    isGrounded = false;
    platforms.forEach(p => {
        if (Math.abs(playerGroup.position.z - p.z) < p.depth / 2 && Math.abs(playerX - p.x) < p.width / 2) {
            if (playerY <= p.y + 0.42 && playerY >= p.y - 0.2) {
                playerY = p.y + 0.42;
                velocityY = 0;
                isGrounded = true;
            }
        }
    });

    if (!isGrounded) {
        leftArmGroup.rotation.x = -Math.PI / 1.2;
        rightArmGroup.rotation.x = -Math.PI / 1.2;
    } else if (currentSpeed !== 0) {
        const runTime = Date.now() * 0.02; // Koşma animasyonu hızlandırıldı
        leftArmGroup.rotation.x = Math.sin(runTime) * 0.8;
        rightArmGroup.rotation.x = -Math.sin(runTime) * 0.8;
        leftLegGroup.rotation.x = -Math.sin(runTime) * 0.7;
        rightLegGroup.rotation.x = Math.sin(runTime) * 0.7;
    } else {
        leftArmGroup.rotation.x = 0; rightArmGroup.rotation.x = 0;
        leftLegGroup.rotation.x = 0; rightLegGroup.rotation.x = 0;
    }

    playerGroup.position.x = playerX;
    playerGroup.position.y = playerY;

    camera.position.x = playerX * 0.4;
    camera.position.y = playerY + 1.8;

    if (currentSpeed !== 0) {
        platforms.forEach(p => { p.z += currentSpeed; p.mesh.position.z = p.z; p.border.position.z = p.z; });
        sushis.forEach(s => {
            s.z += currentSpeed;
            s.group.position.z = s.z;
            s.group.rotation.y += 0.03;

            if (!s.collected && Math.abs(playerX - s.x) < 0.7 && Math.abs(playerGroup.position.z - s.z) < 0.7 && Math.abs(playerY - s.y) < 0.9) {
                s.collected = true;
                scene.remove(s.group);
                currentSessionSushi++;
                totalSushi++;
                updateUI();
            }
        });
        sceneryBuildings.forEach(b => { b.z += currentSpeed; b.group.position.z = b.z; });
        clouds.forEach(c => { c.position.z += currentSpeed * 0.5; if (c.position.z > 20) c.position.z = -120; });
    }

    if (playerY < -4) gameOver();

    if (platforms.length > 0 && platforms[platforms.length - 1].z > 5) {
        level++;
        document.getElementById('levelDisplay').innerText = `Aşama: ${level}`;
        buildLevel();
    }
}

function animate() {
    requestAnimationFrame(animate);
    update();
    renderer.render(scene, camera);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

init3D();
</script>
</body>
</html>
