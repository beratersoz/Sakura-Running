<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Runner 3D - Ultra Realistic Parkour</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0512;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* OYUN İÇİ UI */
        #ui-container {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: none;
            justify-content: space-between;
            font-size: 22px;
            font-weight: 800;
            text-shadow: 0 3px 10px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
        }
        #status-msg {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #ffda79;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        /* Menü Kartı Stili */
        .menu-card {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 390px;
            background: rgba(15, 8, 25, 0.94);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        .menu-title {
            font-size: 30px;
            font-weight: 900;
            color: #ff7924;
            text-shadow: 0 0 15px rgba(255,121,36,0.6);
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .currency-box {
            background: rgba(255,255,255,0.06);
            border: 1px dashed rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-around;
            font-size: 15px;
            font-weight: bold;
            color: #ffda79;
        }

        .developer-tag {
            font-size: 13px;
            color: #aaa;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 8px;
            margin-top: 4px;
        }

        /* Buton Stilleri */
        .btn {
            background: linear-gradient(45deg, #ff5252, #ff7924);
            color: white;
            border: none;
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 82, 82, 0.4);
            transition: all 0.2s ease;
            width: 100%;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 82, 82, 0.6);
        }
        .btn-sell {
            background: linear-gradient(45deg, #10ac84, #1dd1a1);
            box-shadow: 0 4px 15px rgba(29, 209, 161, 0.4);
        }
        .btn-secondary {
            background: linear-gradient(45deg, #6c5ce7, #a29bfe);
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }
        .btn-shop {
            background: linear-gradient(45deg, #f1c40f, #f39c12);
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.4);
        }

        /* Özelleştirme Detayları */
        .section-title { font-size: 13px; color: #ff7924; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; text-align: left; }
        .color-options { display: flex; gap: 10px; justify-content: flex-start; }
        .color-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .color-btn:hover { transform: scale(1.15); }

        /* ÖLDÜN EKRANI */
        #game-over-menu {
            display: none;
            border: 1px solid rgba(255, 50, 50, 0.3);
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.3);
        }
        #game-over-title {
            color: #ff3838;
            font-size: 42px;
            text-shadow: 0 0 15px rgba(255, 56, 56, 0.8);
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        .shop-item button {
            width: auto;
            padding: 6px 12px;
            font-size: 12px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<!-- OYUN İÇİ ARAYÜZ -->
<div id="ui-container">
    <div id="scoreDisplay">Sushi: 0</div>
    <div id="levelDisplay">Aşama: 1</div>
</div>
<div id="status-msg">İlerlemek için W, geri gitmek için S tuşuna basın!</div>

<!-- ANA MENÜ -->
<div id="main-menu" class="menu-card">
    <div class="menu-title">SAKURA RUNNER</div>
    
    <div class="currency-box">
        <span>🍣 Sushi: <span id="total-sushi">0</span></span>
        <span>💴 Yen: <span id="total-yen">0</span></span>
    </div>

    <button class="btn" onclick="startGame()">Oyuna Başla</button>
    <button class="btn btn-sell" onclick="sellSushi()">🍣 Sushi Sat (+10¥)</button>
    <button class="btn btn-shop" onclick="openShopMenu()">🛒 Mağaza (Aksesuar)</button>
    <button class="btn btn-secondary" onclick="openCustomizeMenu()">Özelleştir</button>
    <div class="developer-tag">Geliştirici: <b>Berat Ersöz</b></div>
</div>

<!-- MAĞAZA MENÜSÜ -->
<div id="shop-menu" class="menu-card" style="display: none;">
    <div class="menu-title" style="font-size: 24px;">Aksesuar Mağazası</div>
    <div class="currency-box">
        <span>💴 Mevcut Yen: <span id="shop-yen">0</span></span>
    </div>
    
    <div class="shop-item">
        <span>🧢 Kırmızı Şapka</span>
        <button id="btn-hat" class="btn" onclick="buyHat()">200 Yen Al</button>
    </div>

    <div class="shop-item">
        <span>🧥 Şık Ceket</span>
        <button id="btn-jacket" class="btn" onclick="buyJacket()">300 Yen Al</button>
    </div>

    <button class="btn btn-secondary" onclick="closeShopMenu()">Geri Dön</button>
</div>

<!-- ÖZELLEŞTİRME MENÜSÜ -->
<div id="custom-menu" class="menu-card" style="display: none;">
    <div class="menu-title" style="font-size: 24px;">Karakter Özelleştirme</div>
    
    <div class="section-title">Kıyafet Rengi</div>
    <div class="color-options">
        <div class="color-btn" style="background: #ff3838;" onclick="setOutfit(0xff3838)"></div>
        <div class="color-btn" style="background: #17c0eb;" onclick="setOutfit(0x17c0eb)"></div>
        <div class="color-btn" style="background: #3ae374;" onclick="setOutfit(0x3ae374)"></div>
        <div class="color-btn" style="background: #fff200;" onclick="setOutfit(0xfff200)"></div>
        <div class="color-btn" style="background: #9c88ff;" onclick="setOutfit(0x9c88ff)"></div>
    </div>

    <div class="section-title">Ten Rengi</div>
    <div class="color-options">
        <div class="color-btn" style="background: #ffdbac;" onclick="setSkin(0xffdbac)"></div>
        <div class="color-btn" style="background: #f1c27d;" onclick="setSkin(0xf1c27d)"></div>
        <div class="color-btn" style="background: #e0ac69;" onclick="setSkin(0xe0ac69)"></div>
        <div class="color-btn" style="background: #6d4c41;" onclick="setSkin(0x6d4c41)"></div>
    </div>

    <div class="section-title">Saç Rengi</div>
    <div class="color-options">
        <div class="color-btn" style="background: #0a192f;" onclick="setHair(0x0a192f)"></div>
        <div class="color-btn" style="background: #111111;" onclick="setHair(0x111111)"></div>
        <div class="color-btn" style="background: #795548;" onclick="setHair(0x795548)"></div>
        <div class="color-btn" style="background: #fbc531;" onclick="setHair(0xfbc531)"></div>
        <div class="color-btn" style="background: #e84118;" onclick="setHair(0xe84118)"></div>
    </div>

    <button class="btn" onclick="closeCustomizeMenu()">Kaydet ve Dön</button>
</div>

<!-- ÖLDÜN EKRANI -->
<div id="game-over-menu" class="menu-card">
    <div id="game-over-title">ÖLDÜN</div>
    <p style="color: #ccc; font-size: 14px; margin-bottom: 5px;">Bulutların arasına düştün!</p>
    <button class="btn" onclick="respawn()">Yeniden Doğ</button>
    <button class="btn btn-secondary" onclick="goToMainMenu()">Ana Menüye Dön</button>
</div>

<script>
let scene, camera, renderer;
let playerGroup, outfitMesh, skinMeshes = [], hairMeshes = [];
let leftArmGroup, rightArmGroup, leftLegGroup, rightLegGroup;
let hatMesh, jacketMesh;

let outfitColor = 0xff3838;
let skinColor = 0xffdbac;
let hairColor = 0x0a192f;

let gameState = 'MAIN_MENU';
let currentSessionSushi = 0;
let totalSushi = 0;
let totalYen = 0;

let hasHat = false;
let hasJacket = false;

let level = 1;
let currentSpeed = 0;
const baseSpeed = 0.065; 

let playerX = 0;
let playerY = 1.2;
let velocityY = 0;
const gravity = -0.012;
const jumpPower = 0.42; 
let isGrounded = true;

const keys = { w: false, s: false, a: false, d: false };

let platforms = [];
let sushis = [];
let sceneryBuildings = [];
let clouds = [];
let backgroundMountains = [];

const levelThemes = [
    { bg: 0x1a0a2a, fog: 0x2d123e, platform: 0x2c1a4d, border: 0xff7924 },
    { bg: 0x091e3a, fog: 0x103254, platform: 0x173a5e, border: 0xfbc531 },
    { bg: 0x22092c, fog: 0x3d1245, platform: 0x481e54, border: 0xff5252 },
    { bg: 0x052329, fog: 0x0a3c42, platform: 0x125159, border: 0x78e08f }
];

function init3D() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(levelThemes[0].bg);
    scene.fog = new THREE.FogExp2(levelThemes[0].fog, 0.012);

    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);

    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // Işıklandırma
    const ambientLight = new THREE.HemisphereLight(0xffdfba, 0x221133, 0.7);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffa86b, 1.6);
    mainLight.position.set(20, 35, 15);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 2048;
    mainLight.shadow.mapSize.height = 2048;
    mainLight.shadow.camera.near = 0.5;
    mainLight.shadow.camera.far = 100;
    mainLight.shadow.bias = -0.0005;
    scene.add(mainLight);

    const rimLight = new THREE.DirectionalLight(0x6495ed, 0.8);
    rimLight.position.set(-20, 15, -20);
    scene.add(rimLight);

    createDetailedCharacter();
    positionCameraForMenu();
    createSkyClouds();
    createBackgroundDistants();
    updateUI();

    window.addEventListener('resize', onWindowResize);

    window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'w' || e.code === 'ArrowUp') {
            keys.w = true;
            if (gameState === 'RUNNING') document.getElementById('status-msg').innerText = "İlerliyorsunuz...";
        }
        if (key === 's' || e.code === 'ArrowDown') {
            keys.s = true;
            if (gameState === 'RUNNING') document.getElementById('status-msg').innerText = "Geri gidiyorsunuz...";
        }
        if (key === 'a' || e.code === 'ArrowLeft') keys.a = true;
        if (key === 'd' || e.code === 'ArrowRight') keys.d = true;

        if (e.code === 'Space' && gameState === 'RUNNING') {
            if (isGrounded) {
                velocityY = jumpPower;
                isGrounded = false;
            }
        }
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'w' || e.code === 'ArrowUp') keys.w = false;
        if (key === 's' || e.code === 'ArrowDown') keys.s = false;
        if (key === 'a' || e.code === 'ArrowLeft') keys.a = false;
        if (key === 'd' || e.code === 'ArrowRight') keys.d = false;

        if (!keys.w && !keys.s && gameState === 'RUNNING') {
            document.getElementById('status-msg').innerText = "Durdu. İlerlemek için W, geri gitmek için S tuşuna basın!";
        }
    });

    animate();
}

function updateUI() {
    document.getElementById('total-sushi').innerText = totalSushi;
    document.getElementById('total-yen').innerText = totalYen;
    document.getElementById('shop-yen').innerText = totalYen;
    document.getElementById('scoreDisplay').innerText = `Sushi: ${currentSessionSushi}`;
}

function sellSushi() {
    if (totalSushi > 0) {
        totalYen += totalSushi * 10;
        alert(`${totalSushi} sushi satıldı ve ${totalSushi * 10} Yen kazanıldı!`);
        totalSushi = 0;
        updateUI();
    } else {
        alert("Satacak hiç sushin yok! Önce parkurda sushi topla.");
    }
}

function openShopMenu() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('shop-menu').style.display = 'flex';
    updateUI();
}

function closeShopMenu() {
    document.getElementById('shop-menu').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
}

function buyHat() {
    if (hasHat) {
        hatMesh.visible = !hatMesh.visible;
        document.getElementById('btn-hat').innerText = hatMesh.visible ? "Çıkar" : "Giydir";
        return;
    }
    if (totalYen >= 200) {
        totalYen -= 200;
        hasHat = true;
        hatMesh.visible = true;
        document.getElementById('btn-hat').innerText = "Çıkar";
        updateUI();
        alert("Kırmızı Şapka satın alındı!");
    } else {
        alert("Yetersiz Yen! Sushi satarak Yen kazanabilirsin.");
    }
}

function buyJacket() {
    if (hasJacket) {
        jacketMesh.visible = !jacketMesh.visible;
        document.getElementById('btn-jacket').innerText = jacketMesh.visible ? "Çıkar" : "Giydir";
        return;
    }
    if (totalYen >= 300) {
        totalYen -= 300;
        hasJacket = true;
        jacketMesh.visible = true;
        document.getElementById('btn-jacket').innerText = "Çıkar";
        updateUI();
        alert("Şık Ceket satın alındı!");
    } else {
        alert("Yetersiz Yen! Sushi satarak Yen kazanabilirsin.");
    }
}

function createSkyClouds() {
    clouds.forEach(c => scene.remove(c));
    clouds = [];

    const cloudMat = new THREE.MeshStandardMaterial({
        color: 0xffeef5,
        transparent: true,
        opacity: 0.75,
        roughness: 0.9,
        metalness: 0.1
    });

    for (let i = 0; i < 40; i++) {
        const cloudGroup = new THREE.Group();
        const puffs = 5 + Math.floor(Math.random() * 5);

        for (let j = 0; j < puffs; j++) {
            const puffGeo = new THREE.DodecahedronGeometry(2 + Math.random() * 2.5, 1);
            const puff = new THREE.Mesh(puffGeo, cloudMat);
            puff.position.set((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 6);
            puff.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            cloudGroup.add(puff);
        }

        cloudGroup.position.set((Math.random() - 0.5) * 120, -5 - Math.random() * 12, -Math.random() * 160);
        scene.add(cloudGroup);
        clouds.push(cloudGroup);
    }
}

function createBackgroundDistants() {
    backgroundMountains.forEach(m => scene.remove(m));
    backgroundMountains = [];

    const mountainMat = new THREE.MeshStandardMaterial({ color: 0x120924, roughness: 1.0 });

    for (let i = 0; i < 12; i++) {
        const mountainGeo = new THREE.ConeGeometry(15 + Math.random() * 20, 30 + Math.random() * 20, 5);
        const mountain = new THREE.Mesh(mountainGeo, mountainMat);
        const side = i % 2 === 0 ? -1 : 1;
        mountain.position.set(side * (45 + Math.random() * 30), -10, -30 - (i * 15));
        scene.add(mountain);
        backgroundMountains.push(mountain);
    }
}

function positionCameraForMenu() {
    camera.position.set(0, 1.3, 2.6);
    camera.lookAt(0, 1.0, 0);
}

function positionCameraForGame() {
    camera.position.set(0, 2.4, 4.8);
    camera.lookAt(0, 1.2, -1);
}

function startGame() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('ui-container').style.display = 'flex';
    document.getElementById('status-msg').style.display = 'block';
    gameState = 'RUNNING';
    currentSessionSushi = 0;
    level = 1;
    playerX = 0;
    playerY = 1.2;
    velocityY = 0;
    playerGroup.position.set(playerX, playerY, 0);
    playerGroup.rotation.y = 0;

    updateUI();
    positionCameraForGame();
    buildLevel();
    document.getElementById('status-msg').innerText = "İlerlemek için W, geri gitmek için S tuşuna basın!";
}

function openCustomizeMenu() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('custom-menu').style.display = 'flex';
    gameState = 'CUSTOMIZE';
}

function closeCustomizeMenu() {
    document.getElementById('custom-menu').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
    gameState = 'MAIN_MENU';
}

function gameOver() {
    gameState = 'GAME_OVER';
    document.getElementById('ui-container').style.display = 'none';
    document.getElementById('status-msg').style.display = 'none';
    document.getElementById('game-over-menu').style.display = 'flex';
}

function respawn() {
    document.getElementById('game-over-menu').style.display = 'none';
    document.getElementById('ui-container').style.display = 'flex';
    document.getElementById('status-msg').style.display = 'block';
    gameState = 'RUNNING';
    playerX = 0;
    playerY = 1.2;
    velocityY = 0;
    playerGroup.position.set(playerX, playerY, 0);
    playerGroup.rotation.y = 0;
    positionCameraForGame();
    buildLevel();
}

function goToMainMenu() {
    document.getElementById('game-over-menu').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
    gameState = 'MAIN_MENU';
    positionCameraForMenu();
    playerX = 0;
    playerY = 1.2;
    playerGroup.position.set(0, 1.2, 0);
    updateUI();
}

function createNameTag(name) {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(30, 10, 196, 44);
    ctx.strokeStyle = '#ff7924'; ctx.lineWidth = 3;
    ctx.strokeRect(30, 10, 196, 44);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(name, 128, 32);

    const texture = new THREE.CanvasTexture(canvas);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture }));
    sprite.scale.set(0.7, 0.18, 1);
    sprite.position.set(0, 1.65, 0);
    return sprite;
}

function createGreyCat() {
    const catGroup = new THREE.Group();
    const catMat = new THREE.MeshStandardMaterial({ color: 0x5a5a60, roughness: 0.6, metalness: 0.1 });
    const innerEarMat = new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.8 });
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x2ed573, roughness: 0.1, metalness: 0.8 });
    const pupilMat = new THREE.MeshBasicMaterial({ color: 0x050505 });

    const bodyGeo = new THREE.CylinderGeometry(0.18, 0.2, 0.35, 12);
    const body = new THREE.Mesh(bodyGeo, catMat);
    body.rotation.x = Math.PI / 2.5;
    body.castShadow = true;
    catGroup.add(body);

    const headGeo = new THREE.SphereGeometry(0.18, 20, 20);
    const head = new THREE.Mesh(headGeo, catMat);
    head.position.set(0, 0.22, 0.28);
    head.castShadow = true;
    catGroup.add(head);

    for (let side of [-1, 1]) {
        const earGeo = new THREE.ConeGeometry(0.06, 0.12, 4);
        const ear = new THREE.Mesh(earGeo, catMat);
        ear.position.set(side * 0.09, 0.38, 0.28);
        ear.rotation.z = -side * 0.2;
        catGroup.add(ear);

        const innerEar = new THREE.Mesh(earGeo, innerEarMat);
        innerEar.scale.set(0.6, 0.8, 0.6);
        innerEar.position.set(side * 0.09, 0.38, 0.29);
        innerEar.rotation.z = -side * 0.2;
        catGroup.add(innerEar);
    }

    for (let side of [-1, 1]) {
        const eyeGeo = new THREE.SphereGeometry(0.035, 12, 12);
        const eye = new THREE.Mesh(eyeGeo, eyeMat);
        eye.position.set(side * 0.07, 0.25, 0.43);
        catGroup.add(eye);

        const pupilGeo = new THREE.SphereGeometry(0.018, 8, 8);
        pupilGeo.scale(0.3, 1, 0.5);
        const pupil = new THREE.Mesh(pupilGeo, pupilMat);
        pupil.position.set(side * 0.07, 0.25, 0.46);
        catGroup.add(pupil);
    }

    for (let px of [-0.1, 0.1]) {
        for (let pz of [-0.1, 0.2]) {
            const pawGeo = new THREE.SphereGeometry(0.05, 10, 10);
            const paw = new THREE.Mesh(pawGeo, catMat);
            paw.position.set(px, -0.12, pz);
            paw.scale.set(1, 0.6, 1.2);
            catGroup.add(paw);
        }
    }

    const tailGeo = new THREE.CylinderGeometry(0.025, 0.015, 0.35, 8);
    const tail = new THREE.Mesh(tailGeo, catMat);
    tail.position.set(0, 0.1, -0.22);
    tail.rotation.x = -Math.PI / 3;
    catGroup.add(tail);

    return catGroup;
}

function createDetailedCharacter() {
    playerGroup = new THREE.Group();
    skinMeshes = [];
    hairMeshes = [];

    const outfitMat = new THREE.MeshStandardMaterial({ color: outfitColor, roughness: 0.3, metalness: 0.1 });
    const skinMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.5 });
    const hairMat = new THREE.MeshStandardMaterial({ color: hairColor, roughness: 0.8 });
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
    const shoeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4, metalness: 0.2 });

    const torsoGeo = new THREE.CylinderGeometry(0.19, 0.15, 0.52, 20);
    outfitMesh = new THREE.Mesh(torsoGeo, outfitMat);
    outfitMesh.position.y = 0.65;
    outfitMesh.castShadow = true;
    playerGroup.add(outfitMesh);

    const jacketGeo = new THREE.CylinderGeometry(0.21, 0.17, 0.54, 20);
    const jacketMat = new THREE.MeshStandardMaterial({ color: 0x222f3e, roughness: 0.2, metalness: 0.1 });
    jacketMesh = new THREE.Mesh(jacketGeo, jacketMat);
    jacketMesh.position.y = 0.65;
    jacketMesh.visible = false;
    jacketMesh.castShadow = true;
    playerGroup.add(jacketMesh);

    const headGeo = new THREE.SphereGeometry(0.185, 32, 32);
    const head = new THREE.Mesh(headGeo, skinMat);
    head.position.y = 1.12;
    head.castShadow = true;
    playerGroup.add(head);
    skinMeshes.push(head);

    const hatGroup = new THREE.Group();
    const hatBaseGeo = new THREE.CylinderGeometry(0.21, 0.21, 0.14, 20);
    const hatMat = new THREE.MeshStandardMaterial({ color: 0xeb2f06, roughness: 0.4 });
    const hatBase = new THREE.Mesh(hatBaseGeo, hatMat);
    hatBase.position.y = 1.25;
    hatGroup.add(hatBase);

    const hatBrimGeo = new THREE.CylinderGeometry(0.24, 0.24, 0.02, 20);
    const hatBrim = new THREE.Mesh(hatBrimGeo, hatMat);
    hatBrim.position.set(0, 1.2, 0.08);
    hatGroup.add(hatBrim);

    hatMesh = hatGroup;
    hatMesh.visible = false;
    playerGroup.add(hatMesh);

    for (let side of [-1, 1]) {
        const eyeGeo = new THREE.SphereGeometry(0.028, 16, 16);
        const eye = new THREE.Mesh(eyeGeo, eyeMat);
        eye.position.set(side * 0.065, 1.14, 0.16);
        playerGroup.add(eye);
    }

    const hairTopGeo = new THREE.SphereGeometry(0.198, 32, 32, 0, Math.PI * 2, 0, Math.PI / 1.75);
    const hairTop = new THREE.Mesh(hairTopGeo, hairMat);
    hairTop.position.set(0, 1.13, 0);
    playerGroup.add(hairTop);
    hairMeshes.push(hairTop);

    const longHairGeo = new THREE.CylinderGeometry(0.15, 0.1, 0.65, 16);
    const longHair = new THREE.Mesh(longHairGeo, hairMat);
    longHair.position.set(0, 0.8, -0.15);
    longHair.rotation.x = -0.15;
    longHair.castShadow = true;
    playerGroup.add(longHair);
    hairMeshes.push(longHair);

    function buildArm(isLeft) {
        const armGroup = new THREE.Group();
        const side = isLeft ? -1 : 1;

        const upperArmGeo = new THREE.CylinderGeometry(0.042, 0.038, 0.26, 16);
        const upperArm = new THREE.Mesh(upperArmGeo, outfitMat);
        upperArm.position.set(0, -0.13, 0);
        upperArm.castShadow = true;
        armGroup.add(upperArm);

        const lowerArmGeo = new THREE.CylinderGeometry(0.038, 0.032, 0.26, 16);
        const lowerArm = new THREE.Mesh(lowerArmGeo, skinMat);
        lowerArm.position.set(0, -0.39, 0);
        lowerArm.castShadow = true;
        armGroup.add(lowerArm);
        skinMeshes.push(lowerArm);

        armGroup.position.set(side * 0.24, 0.86, 0);
        return armGroup;
    }

    leftArmGroup = buildArm(true);
    rightArmGroup = buildArm(false);
    playerGroup.add(leftArmGroup);
    playerGroup.add(rightArmGroup);

    const legGeo = new THREE.CylinderGeometry(0.06, 0.05, 0.42, 16);
    leftLegGroup = new THREE.Mesh(legGeo, outfitMat);
    leftLegGroup.position.set(-0.09, 0.21, 0);
    leftLegGroup.castShadow = true;
    playerGroup.add(leftLegGroup);

    rightLegGroup = new THREE.Mesh(legGeo, outfitMat);
    rightLegGroup.position.set(0.09, 0.21, 0);
    rightLegGroup.castShadow = true;
    playerGroup.add(rightLegGroup);

    const shoeGeo = new THREE.BoxGeometry(0.1, 0.08, 0.2);
    for (let side of [-1, 1]) {
        const shoe = new THREE.Mesh(shoeGeo, shoeMat);
        shoe.position.set(side * 0.09, 0.02, 0.03);
        shoe.castShadow = true;
        playerGroup.add(shoe);
    }

    const nameTagSprite = createNameTag("MEVA");
    playerGroup.add(nameTagSprite);

    playerGroup.position.set(playerX, playerY, 0);
    scene.add(playerGroup);
}

function setOutfit(color) { outfitColor = color; if (outfitMesh) outfitMesh.material.color.setHex(color); }
function setSkin(color) { skinColor = color; skinMeshes.forEach(m => m.material.color.setHex(color)); }
function setHair(color) { hairColor = color; hairMeshes.forEach(m => m.material.color.setHex(color)); }

function create3DJapaneseSign(text, mainColorHex) {
    const signGroup = new THREE.Group();

    const boxGeo = new THREE.BoxGeometry(0.25, 2.2, 1.1);
    const boxMat = new THREE.MeshStandardMaterial({ color: 0x0a0a10, roughness: 0.2, metalness: 0.8 });
    const box = new THREE.Mesh(boxGeo, boxMat);
    signGroup.add(box);

    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, 128, 256);
    ctx.strokeStyle = mainColorHex; ctx.lineWidth = 8;
    ctx.strokeRect(6, 6, 116, 244);
    
    ctx.fillStyle = mainColorHex;
    ctx.textAlign = 'center';

    if (text === "RIP ARTHUR MORGAN") {
        ctx.font = '900 20px sans-serif';
        ctx.fillText("R.I.P.", 64, 50);
        ctx.font = '900 18px sans-serif';
        ctx.fillText("ARTHUR", 64, 110);
        ctx.fillText("MORGAN", 64, 170);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText("🤠", 64, 220);
    } else {
        ctx.font = '900 44px sans-serif';
        for (let i = 0; i < text.length; i++) {
            ctx.fillText(text[i], 64, 60 + (i * 50));
        }
    }

    const texture = new THREE.CanvasTexture(canvas);
    const neonMat = new THREE.MeshBasicMaterial({ map: texture });
    
    const planeGeo = new THREE.PlaneGeometry(1.05, 2.15);
    const planeLeft = new THREE.Mesh(planeGeo, neonMat);
    planeLeft.position.x = 0.13; planeLeft.rotation.y = Math.PI / 2;
    signGroup.add(planeLeft);

    const planeRight = new THREE.Mesh(planeGeo, neonMat);
    planeRight.position.x = -0.13; planeRight.rotation.y = -Math.PI / 2;
    signGroup.add(planeRight);

    return signGroup;
}

function createJapaneseHouse(x, y, z, isLeft, forceArthurSign) {
    const group = new THREE.Group();

    const bodyGeo = new THREE.BoxGeometry(4.8, 4.2, 5.8);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x241811, roughness: 0.8 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.castShadow = true;
    body.receiveShadow = true;
    group.add(body);

    const roofGeo = new THREE.ConeGeometry(4.5, 2.0, 4);
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x191e24, roughness: 0.3, metalness: 0.2 });
    const roof = new THREE.Mesh(roofGeo, roofMat);
    roof.position.y = 3.0;
    roof.rotation.y = Math.PI / 4;
    roof.castShadow = true;
    group.add(roof);

    const windowMat = new THREE.MeshBasicMaterial({ color: 0xffd166 });
    for (let wz of [-1.5, 1.5]) {
        const windowGeo = new THREE.PlaneGeometry(1.2, 1.2);
        const win = new THREE.Mesh(windowGeo, windowMat);
        win.position.set(isLeft ? 2.41 : -2.41, 0.5, wz);
        win.rotation.y = isLeft ? Math.PI / 2 : -Math.PI / 2;
        group.add(win);
    }

    const cat = createGreyCat();
    cat.position.set(0, 4.0, 0);
    cat.rotation.y = isLeft ? Math.PI / 2 : -Math.PI / 2;
    group.add(cat);

    let signText = "";
    let signColor = "#ff0055";

    if (forceArthurSign) {
        signText = "RIP ARTHUR MORGAN";
        signColor = "#ff2222";
    } else {
        const texts = ["ラーメン", "寿司", "桜", "東京", "走る"];
        const colors = ["#ff0055", "#00e5ff", "#ffea00", "#00ff66", "#ff7924"];
        const randIdx = Math.floor(Math.random() * texts.length);
        signText = texts[randIdx];
        signColor = colors[randIdx];
    }

    const sign = create3DJapaneseSign(signText, signColor);
    sign.position.set(isLeft ? 2.5 : -2.5, 0.5, 0);
    group.add(sign);

    group.position.set(x, y + 2.1, z);
    scene.add(group);

    sceneryBuildings.push({ group: group, z: z });
}

function createPlatform(x, y, z, width, depth, theme) {
    const geo = new THREE.BoxGeometry(width, 0.45, depth);
    const mat = new THREE.MeshStandardMaterial({ color: theme.platform, roughness: 0.4, metalness: 0.1 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    mesh.receiveShadow = true;
    scene.add(mesh);

    const borderGeo = new THREE.BoxGeometry(width + 0.1, 0.1, depth + 0.1);
    const borderMat = new THREE.MeshStandardMaterial({ color: theme.border, roughness: 0.2, metalness: 0.5 });
    const border = new THREE.Mesh(borderGeo, borderMat);
    border.position.set(x, y + 0.225, z);
    scene.add(border);

    platforms.push({ mesh, border, width, depth, x, y, z });
}

function createSushi(x, y, z) {
    const group = new THREE.Group();

    const riceBaseGeo = new THREE.BoxGeometry(0.36, 0.22, 0.62);
    const riceMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 });
    const riceBase = new THREE.Mesh(riceBaseGeo, riceMat);
    riceBase.castShadow = true;
    group.add(riceBase);

    const salmonGeo = new THREE.BoxGeometry(0.39, 0.12, 0.66);
    const salmonMat = new THREE.MeshStandardMaterial({ color: 0xff4757, roughness: 0.2, metalness: 0.1 });
    const salmon = new THREE.Mesh(salmonGeo, salmonMat);
    salmon.position.y = 0.15;
    salmon.castShadow = true;
    group.add(salmon);

    const noriGeo = new THREE.BoxGeometry(0.41, 0.28, 0.15);
    const noriMat = new THREE.MeshStandardMaterial({ color: 0x1e272e, roughness: 0.5 });
    const nori = new THREE.Mesh(noriGeo, noriMat);
    nori.position.y = 0.05;
    group.add(nori);

    group.position.set(x, y, z);
    scene.add(group);

    sushis.push({ group, collected: false, x, y, z });
}

function buildLevel() {
    platforms.forEach(p => { scene.remove(p.mesh); scene.remove(p.border); });
    sushis.forEach(s => scene.remove(s.group));
    sceneryBuildings.forEach(b => scene.remove(b.group));

    platforms = [];
    sushis = [];
    sceneryBuildings = [];

    const currentTheme = levelThemes[(level - 1) % levelThemes.length];
    scene.background.setHex(currentTheme.bg);
    scene.fog.color.setHex(currentTheme.fog);

    let currentZ = 0;
    const arthurHouseIndex = 2;

    for (let i = 0; i < 15; i++) {
        let pWidth = 4.5 + Math.random() * 1.5;
        let pDepth = 7 + Math.random() * 3;
        let pY = 0;
        let pX = (Math.random() - 0.5) * 1.5;

        createPlatform(pX, pY, currentZ, pWidth, pDepth, currentTheme);

        const isArthurHere = (i === arthurHouseIndex);
        createJapaneseHouse(-8.5 - Math.random() * 2, pY - 0.5, currentZ, true, isArthurHere);
        createJapaneseHouse(8.5 + Math.random() * 2, pY - 0.5, currentZ, false, false);

        if (Math.random() > 0.25) {
            let sushiX = pX + (Math.random() - 0.5) * (pWidth - 1);
            createSushi(sushiX, pY + 0.6, currentZ - Math.random() * (pDepth / 2));
        }

        currentZ -= (pDepth + 1.8 + Math.random() * 1.2);
    }
}

function update() {
    if (gameState === 'MAIN_MENU' || gameState === 'CUSTOMIZE') {
        if (playerGroup) {
            playerGroup.rotation.y += 0.01;
        }
        return;
    }

    if (gameState === 'GAME_OVER') return;

    if (keys.w) {
        currentSpeed = baseSpeed + (level * 0.002);
    } else if (keys.s) {
        currentSpeed = -(baseSpeed + (level * 0.002));
    } else {
        currentSpeed = 0;
    }

    if (keys.a && playerX > -4) playerX -= 0.055;
    if (keys.d && playerX < 4) playerX += 0.055;

    velocityY += gravity;
    playerY += velocityY;

    isGrounded = false;
    platforms.forEach(p => {
        if (Math.abs(playerGroup.position.z - p.z) < p.depth / 2 &&
            Math.abs(playerX - p.x) < p.width / 2) {
            
            if (playerY <= p.y + 0.42 && playerY >= p.y - 0.2) {
                playerY = p.y + 0.42;
                velocityY = 0;
                isGrounded = true;
            }
        }
    });

    if (!isGrounded) {
        leftArmGroup.rotation.x = -Math.PI / 1.2;
        rightArmGroup.rotation.x = -Math.PI / 1.2;
        leftLegGroup.rotation.x = 0.6;
        rightLegGroup.rotation.x = -0.4;
    } else if (currentSpeed !== 0) {
        const runTime = Date.now() * 0.011;
        const dir = currentSpeed > 0 ? 1 : -1;
        leftArmGroup.rotation.x = Math.sin(runTime) * 0.8 * dir;
        rightArmGroup.rotation.x = -Math.sin(runTime) * 0.8 * dir;
        leftLegGroup.rotation.x = -Math.sin(runTime) * 0.7 * dir;
        rightLegGroup.rotation.x = Math.sin(runTime) * 0.7 * dir;
    } else {
        leftArmGroup.rotation.x = 0;
        rightArmGroup.rotation.x = 0;
        leftLegGroup.rotation.x = 0;
        rightLegGroup.rotation.x = 0;
    }

    playerGroup.position.x = playerX;
    playerGroup.position.y = playerY;

    camera.position.x = playerX * 0.4;
    camera.position.y = playerY + 1.8;

    if (currentSpeed !== 0) {
        platforms.forEach(p => {
            p.z += currentSpeed;
            p.mesh.position.z = p.z;
            p.border.position.z = p.z;
        });

        sushis.forEach(s => {
            s.z += currentSpeed;
            s.group.position.z = s.z;
            s.group.rotation.y += 0.02;

            if (!s.collected && 
                Math.abs(playerX - s.x) < 0.6 && 
                Math.abs(playerGroup.position.z - s.z) < 0.6 && 
                Math.abs(playerY - s.y) < 0.8) {
                
                s.collected = true;
                scene.remove(s.group);
                currentSessionSushi++;
                totalSushi++;
                updateUI();
            }
        });

        sceneryBuildings.forEach(b => {
            b.z += currentSpeed;
            b.group.position.z = b.z;
        });

        clouds.forEach(c => {
            c.position.z += currentSpeed * 0.5;
            if (c.position.z > 20) {
                c.position.z = -120;
            }
        });
    }

    if (playerY < -4) {
        gameOver();
    }

    if (platforms.length > 0 && platforms[platforms.length - 1].z > 5) {
        level++;
        document.getElementById('levelDisplay').innerText = `Aşama: ${level}`;
        buildLevel();
    }
}

function animate() {
    requestAnimationFrame(animate);
    update();
    renderer.render(scene, camera);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

init3D();
</script>
</body>
</html>
