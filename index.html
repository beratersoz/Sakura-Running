<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sakura Runner 3D - Detailed Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body {
            background-color: #05020a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* OYUN İÇİ UI */
        #ui-container {
            position: absolute;
            top: 15px; left: 15px; right: 15px;
            display: none;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 800;
            text-shadow: 0 3px 10px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
        }
        #status-msg {
            position: absolute;
            top: 50px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #ffda79;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        /* MOBİL DOKUNMATİK KONTROLLER */
        #mobile-controls {
            position: absolute;
            bottom: 30px;
            left: 0; right: 0;
            padding: 0 25px;
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 15;
            pointer-events: none;
        }

        .dpad-container {
            display: grid;
            grid-template-columns: repeat(3, 75px);
            grid-template-rows: repeat(3, 75px);
            gap: 8px;
            pointer-events: auto;
        }

        .touch-btn {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 18px;
            color: white;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .touch-btn:active {
            background: rgba(255, 121, 36, 0.9);
            border-color: #ff7924;
            transform: scale(0.92);
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
        #btn-right { grid-column: 3; grid-row: 2; }

        #btn-jump {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(255, 82, 82, 0.75);
            border: 3px solid #ff5252;
            font-size: 20px;
            font-weight: 900;
            box-shadow: 0 6px 20px rgba(255, 82, 82, 0.6);
            pointer-events: auto;
        }
        #btn-jump:active {
            background: rgba(255, 82, 82, 1);
            transform: scale(0.9);
        }

        /* Menü Kartı Stili */
        .menu-card {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 380px;
            background: rgba(10, 5, 18, 0.95);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        .menu-title {
            font-size: 26px;
            font-weight: 900;
            color: #ff7924;
            text-shadow: 0 0 15px rgba(255,121,36,0.6);
            letter-spacing: 1px;
        }

        .currency-box {
            background: rgba(255,255,255,0.06);
            border: 1px dashed rgba(255,255,255,0.2);
            padding: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-around;
            font-size: 14px;
            font-weight: bold;
            color: #ffda79;
        }

        .developer-tag {
            font-size: 12px;
            color: #aaa;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 6px;
        }

        .btn {
            background: linear-gradient(45deg, #ff5252, #ff7924);
            color: white;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 82, 82, 0.4);
            width: 100%;
        }
        .btn-sell { background: linear-gradient(45deg, #10ac84, #1dd1a1); }
        .btn-secondary { background: linear-gradient(45deg, #6c5ce7, #a29bfe); }
        .btn-shop { background: linear-gradient(45deg, #f1c40f, #f39c12); }

        .section-title { font-size: 12px; color: #ff7924; font-weight: bold; text-align: left; }
        .color-options { display: flex; gap: 8px; justify-content: flex-start; }
        .color-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; }

        #game-over-menu { display: none; border: 1px solid rgba(255, 50, 50, 0.3); }
        #game-over-title { color: #ff3838; font-size: 36px; text-shadow: 0 0 15px rgba(255, 56, 56, 0.8); }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
        }
        .shop-item button { width: auto; padding: 5px 10px; font-size: 11px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<!-- OYUN İÇİ ARAYÜZ -->
<div id="ui-container">
    <div id="scoreDisplay">Sushi: 0</div>
    <div id="levelDisplay">Aşama: 1</div>
</div>
<div id="status-msg">İlerlemek için Yön Tuşlarını veya Ekranı Kullanın!</div>

<!-- MOBİL KONTROLLER -->
<div id="mobile-controls">
    <div class="dpad-container">
        <div class="touch-btn" id="btn-up">▲</div>
        <div class="touch-btn" id="btn-left">◄</div>
        <div class="touch-btn" id="btn-down">▼</div>
        <div class="touch-btn" id="btn-right">►</div>
    </div>
    <div class="touch-btn" id="btn-jump">ZIPLA</div>
</div>

<!-- ANA MENÜ -->
<div id="main-menu" class="menu-card">
    <div class="menu-title">SAKURA RUNNER</div>
    
    <div class="currency-box">
        <span>🍣 Sushi: <span id="total-sushi">0</span></span>
        <span>💴 Yen: <span id="total-yen">0</span></span>
    </div>

    <button class="btn" onclick="startGame()">Oyuna Başla</button>
    <button class="btn btn-sell" onclick="sellSushi()">🍣 Sushi Sat (+10¥)</button>
    <button class="btn btn-shop" onclick="openShopMenu()">🛒 Mağaza (Aksesuar)</button>
    <button class="btn btn-secondary" onclick="openCustomizeMenu()">Özelleştir</button>
    <div class="developer-tag">Geliştirici: <b>Berat Ersöz</b></div>
</div>

<!-- MAĞAZA MENÜSÜ -->
<div id="shop-menu" class="menu-card" style="display: none;">
    <div class="menu-title" style="font-size: 22px;">Aksesuar Mağazası</div>
    <div class="currency-box">
        <span>💴 Mevcut Yen: <span id="shop-yen">0</span></span>
    </div>
    
    <div class="shop-item">
        <span>🧢 Kırmızı Şapka</span>
        <button id="btn-hat" class="btn" onclick="buyHat()">200 Yen Al</button>
    </div>

    <div class="shop-item">
        <span>🧥 Şık Ceket</span>
        <button id="btn-jacket" class="btn" onclick="buyJacket()">300 Yen Al</button>
    </div>

    <button class="btn btn-secondary" onclick="closeShopMenu()">Geri Dön</button>
</div>

<!-- ÖZELLEŞTİRME MENÜSÜ -->
<div id="custom-menu" class="menu-card" style="display: none;">
    <div class="menu-title" style="font-size: 22px;">Karakter Özelleştirme</div>
    
    <div class="section-title">Kıyafet Rengi</div>
    <div class="color-options">
        <div class="color-btn" style="background: #ff3838;" onclick="setOutfit(0xff3838)"></div>
        <div class="color-btn" style="background: #17c0eb;" onclick="setOutfit(0x17c0eb)"></div>
        <div class="color-btn" style="background: #3ae374;" onclick="setOutfit(0x3ae374)"></div>
        <div class="color-btn" style="background: #fff200;" onclick="setOutfit(0xfff200)"></div>
        <div class="color-btn" style="background: #9c88ff;" onclick="setOutfit(0x9c88ff)"></div>
    </div>

    <div class="section-title">Ten Rengi</div>
    <div class="color-options">
        <div class="color-btn" style="background: #ffdbac;" onclick="setSkin(0xffdbac)"></div>
        <div class="color-btn" style="background: #f1c27d;" onclick="setSkin(0xf1c27d)"></div>
        <div class="color-btn" style="background: #e0ac69;" onclick="setSkin(0xe0ac69)"></div>
        <div class="color-btn" style="background: #6d4c41;" onclick="setSkin(0x6d4c41)"></div>
    </div>

    <div class="section-title">Saç Rengi</div>
    <div class="color-options">
        <div class="color-btn" style="background: #0a192f;" onclick="setHair(0x0a192f)"></div>
        <div class="color-btn" style="background: #111111;" onclick="setHair(0x111111)"></div>
        <div class="color-btn" style="background: #795548;" onclick="setHair(0x795548)"></div>
        <div class="color-btn" style="background: #fbc531;" onclick="setHair(0xfbc531)"></div>
        <div class="color-btn" style="background: #e84118;" onclick="setHair(0xe84118)"></div>
    </div>

    <button class="btn" onclick="closeCustomizeMenu()">Kaydet ve Dön</button>
</div>

<!-- ÖLDÜN EKRANI -->
<div id="game-over-menu" class="menu-card">
    <div id="game-over-title">ÖLDÜN</div>
    <p style="color: #ccc; font-size: 13px; margin-bottom: 5px;">Bulutların arasına düştün!</p>
    <button class="btn" onclick="respawn()">Yeniden Doğ</button>
    <button class="btn btn-secondary" onclick="goToMainMenu()">Ana Menüye Dön</button>
</div>

<script>
let scene, camera, renderer;
let playerGroup, outfitMesh, skinMeshes = [], hairMeshes = [];
let leftArmGroup, rightArmGroup, leftLegGroup, rightLegGroup;
let hatMesh, jacketMesh;

let outfitColor = 0xff3838;
let skinColor = 0xffdbac;
let hairColor = 0x0a192f;

let gameState = 'MAIN_MENU';
let currentSessionSushi = 0;
let totalSushi = 0;
let totalYen = 0;

let hasHat = false;
let hasJacket = false;

let level = 1;
let currentSpeed = 0;

const baseSpeed = 0.15;
const strafeSpeed = 0.14;
const gravity = -0.018;
const jumpPower = 0.54;

let playerX = 0;
let playerY = 1.2;
let velocityY = 0;
let isGrounded = true;

const keys = { w: false, s: false, a: false, d: false };

let platforms = [];
let sushis = [];
let sceneryBuildings = [];
let clouds = [];
let backgroundMountains = [];

const levelThemes = [
    { bg: 0x12041c, fog: 0x220938, platform: 0x2c1a4d, border: 0xff7924 },
    { bg: 0x031326, fog: 0x0a2540, platform: 0x173a5e, border: 0xfbc531 },
    { bg: 0x1d0324, fog: 0x33093d, platform: 0x481e54, border: 0xff5252 },
    { bg: 0x021a1f, fog: 0x073138, platform: 0x125159, border: 0x78e08f }
];

function init3D() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(levelThemes[0].bg);
    scene.fog = new THREE.FogExp2(levelThemes[0].fog, 0.015);

    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);

    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.HemisphereLight(0xffbe98, 0x110826, 1.2);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xff9e59, 2.0);
    mainLight.position.set(20, 35, 15);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 1024;
    mainLight.shadow.mapSize.height = 1024;
    scene.add(mainLight);

    const rimLight = new THREE.DirectionalLight(0x8a2be2, 1.5);
    rimLight.position.set(-20, 15, -20);
    scene.add(rimLight);

    const cyanLight = new THREE.PointLight(0x00ffff, 1.2, 50);
    cyanLight.position.set(10, 5, -10);
    scene.add(cyanLight);

    createDetailedCharacter();
    positionCameraForMenu();
    createSkyClouds();
    createBackgroundDistants();
    setupTouchControls();
    updateUI();

    window.addEventListener('resize', onWindowResize);

    window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'w' || e.code === 'ArrowUp') keys.w = true;
        if (key === 's' || e.code === 'ArrowDown') keys.s = true;
        if (key === 'a' || e.code === 'ArrowLeft') keys.a = true;
        if (key === 'd' || e.code === 'ArrowRight') keys.d = true;
        if (e.code === 'Space' && gameState === 'RUNNING') handleJump();
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'w' || e.code === 'ArrowUp') keys.w = false;
        if (key === 's' || e.code === 'ArrowDown') keys.s = false;
        if (key === 'a' || e.code === 'ArrowLeft') keys.a = false;
        if (key === 'd' || e.code === 'ArrowRight') keys.d = false;
    });

    animate();
}

function handleJump() {
    if (isGrounded) {
        velocityY = jumpPower;
        isGrounded = false;
    }
}

function setupTouchControls() {
    const bindTouch = (id, keyName) => {
        const btn = document.getElementById(id);
        const start = (e) => { e.preventDefault(); keys[keyName] = true; };
        const end = (e) => { e.preventDefault(); keys[keyName] = false; };
        btn.addEventListener('touchstart', start);
        btn.addEventListener('touchend', end);
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
    };

    bindTouch('btn-up', 'w');
    bindTouch('btn-down', 's');
    bindTouch('btn-left', 'a');
    bindTouch('btn-right', 'd');

    const jumpBtn = document.getElementById('btn-jump');
    const jumpAction = (e) => { e.preventDefault(); if (gameState === 'RUNNING') handleJump(); };
    jumpBtn.addEventListener('touchstart', jumpAction);
    jumpBtn.addEventListener('mousedown', jumpAction);
}

function updateUI() {
    document.getElementById('total-sushi').innerText = totalSushi;
    document.getElementById('total-yen').innerText = totalYen;
    document.getElementById('shop-yen').innerText = totalYen;
    document.getElementById('scoreDisplay').innerText = `Sushi: ${currentSessionSushi}`;
}

function sellSushi() {
    if (totalSushi > 0) {
        totalYen += totalSushi * 10;
        alert(`${totalSushi} sushi satıldı ve ${totalSushi * 10} Yen kazanıldı!`);
        totalSushi = 0;
        updateUI();
    } else {
        alert("Satacak hiç sushin yok! Önce parkurda sushi topla.");
    }
}

function openShopMenu() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('shop-menu').style.display = 'flex';
    updateUI();
}

function closeShopMenu() {
    document.getElementById('shop-menu').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
}

function buyHat() {
    if (hasHat) {
        hatMesh.visible = !hatMesh.visible;
        document.getElementById('btn-hat').innerText = hatMesh.visible ? "Çıkar" : "Giydir";
        return;
    }
    if (totalYen >= 200) {
        totalYen -= 200;
        hasHat = true;
        hatMesh.visible = true;
        document.getElementById('btn-hat').innerText = "Çıkar";
        updateUI();
        alert("Kırmızı Şapka satın alındı!");
    } else {
        alert("Yetersiz Yen!");
    }
}

function buyJacket() {
    if (hasJacket) {
        jacketMesh.visible = !jacketMesh.visible;
        document.getElementById('btn-jacket').innerText = jacketMesh.visible ? "Çıkar" : "Giydir";
        return;
    }
    if (totalYen >= 300) {
        totalYen -= 300;
        hasJacket = true;
        jacketMesh.visible = true;
        document.getElementById('btn-jacket').innerText = "Çıkar";
        updateUI();
        alert("Şık Ceket satın alındı!");
    } else {
        alert("Yetersiz Yen!");
    }
}

function createSkyClouds() {
    clouds.forEach(c => scene.remove(c));
    clouds = [];
    const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffeef5, transparent: true, opacity: 0.6, roughness: 0.8 });

    for (let i = 0; i < 35; i++) {
        const cloudGroup = new THREE.Group();
        for (let j = 0; j < 6; j++) {
            const puff = new THREE.Mesh(new THREE.DodecahedronGeometry(2.5 + Math.random() * 2, 1), cloudMat);
            puff.position.set((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 6);
            cloudGroup.add(puff);
        }
        cloudGroup.position.set((Math.random() - 0.5) * 140, -4 - Math.random() * 12, -Math.random() * 180);
        scene.add(cloudGroup);
        clouds.push(cloudGroup);
    }
}

function createBackgroundDistants() {
    backgroundMountains.forEach(m => scene.remove(m));
    backgroundMountains = [];
    const mountainMat = new THREE.MeshStandardMaterial({ color: 0x0d0618, roughness: 1.0 });

    for (let i = 0; i < 12; i++) {
        const mountain = new THREE.Mesh(new THREE.ConeGeometry(18 + Math.random() * 20, 35 + Math.random() * 20, 6), mountainMat);
        const side = i % 2 === 0 ? -1 : 1;
        mountain.position.set(side * (50 + Math.random() * 30), -12, -20 - (i * 15));
        scene.add(mountain);
        backgroundMountains.push(mountain);
    }
}

function positionCameraForMenu() {
    camera.position.set(0, 1.2, 2.5);
    camera.lookAt(0, 1.0, 0);
}

function positionCameraForGame() {
    camera.position.set(0, 2.4, 4.8);
    camera.lookAt(0, 1.2, -1);
}

function startGame() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('ui-container').style.display = 'flex';
    document.getElementById('mobile-controls').style.display = 'flex';
    document.getElementById('status-msg').style.display = 'block';
    gameState = 'RUNNING';
    currentSessionSushi = 0;
    level = 1;
    playerX = 0;
    playerY = 1.2;
    velocityY = 0;
    playerGroup.position.set(playerX, playerY, 0);
    playerGroup.rotation.y = Math.PI;

    updateUI();
    positionCameraForGame();
    buildLevel();
}

function openCustomizeMenu() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('custom-menu').style.display = 'flex';
    gameState = 'CUSTOMIZE';
}

function closeCustomizeMenu() {
    document.getElementById('custom-menu').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
    gameState = 'MAIN_MENU';
}

function gameOver() {
    gameState = 'GAME_OVER';
    document.getElementById('ui-container').style.display = 'none';
    document.getElementById('mobile-controls').style.display = 'none';
    document.getElementById('status-msg').style.display = 'none';
    document.getElementById('game-over-menu').style.display = 'flex';
}

function respawn() {
    document.getElementById('game-over-menu').style.display = 'none';
    document.getElementById('ui-container').style.display = 'flex';
    document.getElementById('mobile-controls').style.display = 'flex';
    document.getElementById('status-msg').style.display = 'block';
    gameState = 'RUNNING';
    playerX = 0;
    playerY = 1.2;
    velocityY = 0;
    playerGroup.position.set(playerX, playerY, 0);
    playerGroup.rotation.y = Math.PI;
    positionCameraForGame();
    buildLevel();
}

function goToMainMenu() {
    document.getElementById('game-over-menu').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
    document.getElementById('mobile-controls').style.display = 'none';
    gameState = 'MAIN_MENU';
    positionCameraForMenu();
    playerX = 0;
    playerY = 1.2;
    playerGroup.position.set(0, 1.2, 0);
    playerGroup.rotation.y = Math.PI;
    updateUI();
}

function createNameTag(name) {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(30, 10, 196, 44);
    ctx.strokeStyle = '#ff7924'; ctx.lineWidth = 3;
    ctx.strokeRect(30, 10, 196, 44);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(name, 128, 32);

    const texture = new THREE.CanvasTexture(canvas);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture }));
    sprite.scale.set(0.7, 0.18, 1);
    sprite.position.set(0, 1.85, 0);
    return sprite;
}

function createGreyCat() {
    const catGroup = new THREE.Group();
    const catMat = new THREE.MeshStandardMaterial({ color: 0x4a4a50, roughness: 0.5 });
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff8c00 });

    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 0.4, 16), catMat);
    body.rotation.x = Math.PI / 2.3;
    catGroup.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 20, 20), catMat);
    head.position.set(0, 0.2, 0.26);
    catGroup.add(head);

    for (let side of [-1, 1]) {
        const ear = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.1, 8), catMat);
        ear.position.set(side * 0.08, 0.34, 0.26);
        catGroup.add(ear);

        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 12), eyeMat);
        eye.position.set(side * 0.06, 0.22, 0.39);
        catGroup.add(eye);
    }
    return catGroup;
}

function createDetailedCharacter() {
    playerGroup = new THREE.Group();
    skinMeshes = [];
    hairMeshes = [];

    const outfitMat = new THREE.MeshStandardMaterial({ color: outfitColor, roughness: 0.4 });
    const skinMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.6 });
    const hairMat = new THREE.MeshStandardMaterial({ color: hairColor, roughness: 0.5 });

    outfitMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.13, 0.5, 24), outfitMat);
    outfitMesh.position.y = 0.65;
    playerGroup.add(outfitMesh);

    const collar = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.03, 12, 24), new THREE.MeshStandardMaterial({ color: 0xffffff }));
    collar.rotation.x = Math.PI / 2;
    collar.position.set(0, 0.88, 0);
    playerGroup.add(collar);

    jacketMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.15, 0.52, 24), new THREE.MeshStandardMaterial({ color: 0x1e272e }));
    jacketMesh.position.y = 0.65;
    jacketMesh.visible = false;
    playerGroup.add(jacketMesh);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 32, 32), skinMat);
    head.position.y = 1.1;
    playerGroup.add(head);
    skinMeshes.push(head);

    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x2e86de });
    const pupilMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    for (let side of [-1, 1]) {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.032, 16, 16), eyeMat);
        eye.position.set(side * 0.055, 1.12, 0.14);
        eye.scale.set(0.6, 1.1, 0.3);
        playerGroup.add(eye);

        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.012, 8, 8), pupilMat);
        pupil.position.set(side * 0.052, 1.14, 0.155);
        playerGroup.add(pupil);
    }

    const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.02, 0.005, 8, 16, Math.PI), new THREE.MeshBasicMaterial({ color: 0xc8d6e5 }));
    mouth.position.set(0, 1.05, 0.15);
    mouth.rotation.x = Math.PI / 2;
    playerGroup.add(mouth);

    // ==========================================
    // SAÇ MODELİ: KAFANIN YUVARLAKLIĞIYLA TAM UYUMLU, DOĞAL VE PÜRÜZSÜZ
    // ==========================================
    const hairGroup = new THREE.Group();

    // 1. Üst ve Arka Saç Kütlesi (Kafayı Tam Kavisli Olarak Kaplar)
    const hairMain = new THREE.Mesh(
        new THREE.SphereGeometry(0.168, 32, 32, 0, Math.PI * 2, 0, Math.PI / 1.45),
        hairMat
    );
    hairMain.position.set(0, 1.105, -0.005);
    hairGroup.add(hairMain);
    hairMeshes.push(hairMain);

    // 2. Arka Düz Uzantı (Sırta Doğru Kavisli ve Pürüzsüz Dökülen Saç)
    const hairBack = new THREE.Mesh(
        new THREE.CylinderGeometry(0.165, 0.15, 0.38, 32, 1, false, Math.PI * 0.75, Math.PI * 1.5),
        hairMat
    );
    hairBack.position.set(0, 0.94, -0.01);
    hairGroup.add(hairBack);
    hairMeshes.push(hairBack);

    // 3. Yan Kavisli Saçlar (Şakakları ve Kulak Üstünü Kaplar)
    const hairSideLeft = new THREE.Mesh(
        new THREE.SphereGeometry(0.167, 16, 16, 0, Math.PI * 0.6, 0.5, Math.PI / 2),
        hairMat
    );
    hairSideLeft.position.set(0, 1.08, 0);
    hairSideLeft.rotation.z = -0.1;
    hairGroup.add(hairSideLeft);
    hairMeshes.push(hairSideLeft);

    const hairSideRight = new THREE.Mesh(
        new THREE.SphereGeometry(0.167, 16, 16, Math.PI * 0.4, Math.PI * 0.6, 0.5, Math.PI / 2),
        hairMat
    );
    hairSideRight.position.set(0, 1.08, 0);
    hairSideRight.rotation.z = 0.1;
    hairGroup.add(hairSideRight);
    hairMeshes.push(hairSideRight);

    // 4. Ön Düz Kaküller (Kafanın Ön Oval Kavisini Takip Eder)
    const bangs = new THREE.Mesh(
        new THREE.CylinderGeometry(0.169, 0.169, 0.08, 32, 1, true, -Math.PI * 0.35, Math.PI * 0.7),
        hairMat
    );
    bangs.position.set(0, 1.19, 0.005);
    hairGroup.add(bangs);
    hairMeshes.push(bangs);

    playerGroup.add(hairGroup);
    // ==========================================

    const hatGroup = new THREE.Group();
    const hatBase = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.12, 20), new THREE.MeshStandardMaterial({ color: 0xeb2f06 }));
    hatBase.position.y = 1.26;
    hatGroup.add(hatBase);
    hatMesh = hatGroup;
    hatMesh.visible = false;
    playerGroup.add(hatMesh);

    function buildArm(isLeft) {
        const armGroup = new THREE.Group();
        const side = isLeft ? -1 : 1;
        
        const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.032, 0.24, 16), outfitMat);
        upperArm.position.set(0, -0.12, 0);
        armGroup.add(upperArm);

        const lowerArm = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.026, 0.24, 16), skinMat);
        lowerArm.position.set(0, -0.34, 0);
        armGroup.add(lowerArm);
        skinMeshes.push(lowerArm);

        const hand = new THREE.Mesh(new THREE.SphereGeometry(0.032, 12, 12), skinMat);
        hand.position.set(0, -0.46, 0);
        armGroup.add(hand);
        skinMeshes.push(hand);

        armGroup.position.set(side * 0.2, 0.85, 0);
        return armGroup;
    }

    leftArmGroup = buildArm(true);
    rightArmGroup = buildArm(false);
    playerGroup.add(leftArmGroup);
    playerGroup.add(rightArmGroup);

    const sockMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const shoeMat = new THREE.MeshStandardMaterial({ color: 0x2e86de });

    function buildLeg(isLeft) {
        const legGroup = new THREE.Group();
        const side = isLeft ? -1 : 1;

        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.038, 0.4, 16), outfitMat);
        leg.position.y = -0.2;
        legGroup.add(leg);

        const sock = new THREE.Mesh(new THREE.CylinderGeometry(0.039, 0.039, 0.1, 16), sockMat);
        sock.position.y = -0.35;
        legGroup.add(sock);

        const shoe = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.05, 0.12, 16), shoeMat);
        shoe.position.set(0, -0.42, 0.03);
        shoe.scale.set(1, 0.7, 1.4);
        legGroup.add(shoe);

        legGroup.position.set(side * 0.08, 0.4, 0);
        return legGroup;
    }

    leftLegGroup = buildLeg(true);
    rightLegGroup = buildLeg(false);
    playerGroup.add(leftLegGroup);
    playerGroup.add(rightLegGroup);

    playerGroup.add(createNameTag("MEVA"));
    playerGroup.position.set(playerX, playerY, 0);
    playerGroup.rotation.y = Math.PI;

    scene.add(playerGroup);
}

function setOutfit(color) { outfitColor = color; if (outfitMesh) outfitMesh.material.color.setHex(color); }
function setSkin(color) { skinColor = color; skinMeshes.forEach(m => m.material.color.setHex(color)); }
function setHair(color) { hairColor = color; hairMeshes.forEach(m => m.material.color.setHex(color)); }

function create3DJapaneseSign(text, mainColorHex) {
    const signGroup = new THREE.Group();
    const box = new THREE.Mesh(new THREE.BoxGeometry(0.25, 2.4, 1.8), new THREE.MeshStandardMaterial({ color: 0x0a0a10 }));
    signGroup.add(box);

    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 320;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, 256, 320);
    ctx.strokeStyle = mainColorHex; ctx.lineWidth = 10;
    ctx.strokeRect(8, 8, 240, 304);
    ctx.fillStyle = mainColorHex; ctx.textAlign = 'center';

    if (text === "MAL MEVA") {
        ctx.font = '900 36px sans-serif';
        ctx.fillText("MAL", 128, 120);
        ctx.fillText("MEVA", 128, 200);
    } else {
        ctx.font = '900 28px sans-serif';
        ctx.fillText("MEVA", 128, 90);
        ctx.fillText("ÇIK", 128, 160);
        ctx.fillText("OYUNDAN", 128, 230);
    }

    const planeGeo = new THREE.PlaneGeometry(1.7, 2.3);
    const neonMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) });
    
    const planeLeft = new THREE.Mesh(planeGeo, neonMat);
    planeLeft.position.x = 0.13; planeLeft.rotation.y = Math.PI / 2;
    signGroup.add(planeLeft);

    const planeRight = new THREE.Mesh(planeGeo, neonMat);
    planeRight.position.x = -0.13; planeRight.rotation.y = -Math.PI / 2;
    signGroup.add(planeRight);

    return signGroup;
}

function createJapaneseHouse(x, y, z, isLeft, signText) {
    const group = new THREE.Group();
    
    // Ev Gövdesi
    const body = new THREE.Mesh(new THREE.BoxGeometry(5.2, 4.5, 6.2), new THREE.MeshStandardMaterial({ color: 0x1a1220, roughness: 0.7 }));
    group.add(body);

    // Çatı
    const roof = new THREE.Mesh(new THREE.ConeGeometry(4.8, 2.2, 4), new THREE.MeshStandardMaterial({ color: 0x0f131a }));
    roof.position.y = 3.2; roof.rotation.y = Math.PI / 4;
    group.add(roof);

    // Pencereler ve Neon Detaylar
    const windowMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
    for(let side of [-1.5, 1.5]) {
        const win = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 1.2), windowMat);
        win.position.set(isLeft ? 2.61 : -2.61, 0.8, side);
        win.rotation.y = isLeft ? Math.PI / 2 : -Math.PI / 2;
        group.add(win);
    }

    // Çatı Üstü Kedi
    const cat = createGreyCat();
    cat.position.set(0, 4.3, 0);
    group.add(cat);

    // Tabela
    const isMalMeva = signText === "MAL MEVA";
    const signColor = isMalMeva ? "#ff0000" : "#00ffff";
    const sign = create3DJapaneseSign(signText, signColor);
    sign.position.set(isLeft ? 2.7 : -2.7, 0.8, 0);
    group.add(sign);

    // Tabela Işık Efekti
    const signLight = new THREE.PointLight(isMalMeva ? 0xff0000 : 0x00ffff, 2.0, 8);
    signLight.position.set(isLeft ? 3.5 : -3.5, 0.8, 0);
    group.add(signLight);

    group.position.set(x, y + 2.25, z);
    scene.add(group);
    sceneryBuildings.push({ group, z });
}

function createPlatform(x, y, z, width, depth, theme) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, 0.45, depth), new THREE.MeshStandardMaterial({ color: theme.platform }));
    mesh.position.set(x, y, z);
    scene.add(mesh);

    const border = new THREE.Mesh(new THREE.BoxGeometry(width + 0.1, 0.1, depth + 0.1), new THREE.MeshStandardMaterial({ color: theme.border }));
    border.position.set(x, y + 0.225, z);
    scene.add(border);

    if (Math.random() > 0.4) {
        const lampGroup = new THREE.Group();
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.5), new THREE.MeshStandardMaterial({ color: 0x333333 }));
        pole.position.y = 1.25;
        lampGroup.add(pole);

        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), new THREE.MeshBasicMaterial({ color: theme.border }));
        bulb.position.y = 2.5;
        lampGroup.add(bulb);

        const light = new THREE.PointLight(theme.border, 1.5, 6);
        light.position.y = 2.5;
        lampGroup.add(light);

        const side = Math.random() > 0.5 ? (width / 2 - 0.2) : -(width / 2 - 0.2);
        lampGroup.position.set(x + side, y + 0.225, z);
        scene.add(lampGroup);
        platforms.push({ mesh: lampGroup, border: null, width: 0, depth: 0, x: 0, y: 0, z: z });
    }

    platforms.push({ mesh, border, width, depth, x, y, z });
}

function createSushi(x, y, z) {
    const group = new THREE.Group();
    const rice = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.22, 16), new THREE.MeshStandardMaterial({ color: 0xffffff }));
    group.add(rice);
    const salmon = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.1, 16), new THREE.MeshStandardMaterial({ color: 0xff4757 }));
    salmon.position.y = 0.12;
    group.add(salmon);

    group.position.set(x, y, z);
    scene.add(group);
    sushis.push({ group, collected: false, x, y, z });
}

function buildLevel() {
    platforms.forEach(p => { if (p.mesh) scene.remove(p.mesh); if (p.border) scene.remove(p.border); });
    sushis.forEach(s => scene.remove(s.group));
    sceneryBuildings.forEach(b => scene.remove(b.group));

    platforms = []; sushis = []; sceneryBuildings = [];
    const currentTheme = levelThemes[(level - 1) % levelThemes.length];
    scene.background.setHex(currentTheme.bg);
    scene.fog.color.setHex(currentTheme.fog);

    const totalHouses = 30;
    const malMevaIndex = Math.floor(Math.random() * totalHouses);

    let currentZ = 0;
    let houseCounter = 0;

    for (let i = 0; i < 15; i++) {
        let pWidth = 4.5 + Math.random() * 1.5;
        let pDepth = 9 + Math.random() * 4;
        let pY = 0;
        let pX = (Math.random() - 0.5) * 1.5;

        createPlatform(pX, pY, currentZ, pWidth, pDepth, currentTheme);

        const leftSignText = (houseCounter === malMevaIndex) ? "MAL MEVA" : "MEVA ÇIK OYUNDAN";
        houseCounter++;
        createJapaneseHouse(-8.5 - Math.random() * 2, pY - 0.5, currentZ, true, leftSignText);

        const rightSignText = (houseCounter === malMevaIndex) ? "MAL MEVA" : "MEVA ÇIK OYUNDAN";
        houseCounter++;
        createJapaneseHouse(8.5 + Math.random() * 2, pY - 0.5, currentZ, false, rightSignText);

        if (Math.random() > 0.25) {
            createSushi(pX + (Math.random() - 0.5) * (pWidth - 1), pY + 0.6, currentZ - Math.random() * (pDepth / 2));
        }

        currentZ -= (pDepth + 2.2 + Math.random() * 1.5);
    }
}

function update() {
    if (gameState === 'MAIN_MENU' || gameState === 'CUSTOMIZE') {
        if (playerGroup) playerGroup.rotation.y += 0.012;
        return;
    }
    if (gameState === 'GAME_OVER') return;

    if (keys.w) currentSpeed = baseSpeed + (level * 0.004);
    else if (keys.s) currentSpeed = -(baseSpeed + (level * 0.004));
    else currentSpeed = 0;

    if (keys.a && playerX > -4) playerX -= strafeSpeed;
    if (keys.d && playerX < 4) playerX += strafeSpeed;

    velocityY += gravity;
    playerY += velocityY;

    isGrounded = false;
    platforms.forEach(p => {
        if (p.depth > 0 && Math.abs(playerGroup.position.z - p.z) < p.depth / 2 && Math.abs(playerX - p.x) < p.width / 2) {
            if (playerY <= p.y + 0.42 && playerY >= p.y - 0.2) {
                playerY = p.y + 0.42;
                velocityY = 0;
                isGrounded = true;
            }
        }
    });

    if (!isGrounded) {
        leftArmGroup.rotation.x = -Math.PI / 1.2;
        rightArmGroup.rotation.x = -Math.PI / 1.2;
    } else if (currentSpeed !== 0) {
        const runTime = Date.now() * 0.025;
        leftArmGroup.rotation.x = Math.sin(runTime) * 0.95;
        rightArmGroup.rotation.x = -Math.sin(runTime) * 0.95;
        leftLegGroup.rotation.x = -Math.sin(runTime) * 0.85;
        rightLegGroup.rotation.x = Math.sin(runTime) * 0.85;
    } else {
        leftArmGroup.rotation.x = 0; rightArmGroup.rotation.x = 0;
        leftLegGroup.rotation.x = 0; rightLegGroup.rotation.x = 0;
    }

    playerGroup.position.x = playerX;
    playerGroup.position.y = playerY;

    camera.position.x = playerX * 0.4;
    camera.position.y = playerY + 1.8;

    if (currentSpeed !== 0) {
        platforms.forEach(p => { 
            p.z += currentSpeed; 
            if (p.mesh) p.mesh.position.z = p.z; 
            if (p.border) p.border.position.z = p.z; 
        });
        sushis.forEach(s => {
            s.z += currentSpeed;
            s.group.position.z = s.z;
            s.group.rotation.y += 0.04;

            if (!s.collected && Math.abs(playerX - s.x) < 0.75 && Math.abs(playerGroup.position.z - s.z) < 0.75 && Math.abs(playerY - s.y) < 0.9) {
                s.collected = true;
                scene.remove(s.group);
                currentSessionSushi++;
                totalSushi++;
                updateUI();
            }
        });
        sceneryBuildings.forEach(b => { b.z += currentSpeed; b.group.position.z = b.z; });
        clouds.forEach(c => { c.position.z += currentSpeed * 0.5; if (c.position.z > 20) c.position.z = -120; });
    }

    if (playerY < -4) gameOver();

    if (platforms.length > 0 && platforms[platforms.length - 1].z > 5) {
        level++;
        document.getElementById('levelDisplay').innerText = `Aşama: ${level}`;
        buildLevel();
    }
}

function animate() {
    requestAnimationFrame(animate);
    update();
    renderer.render(scene, camera);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

init3D();
</script>
</body>
</html>
